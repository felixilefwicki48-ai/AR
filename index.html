<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Escape Room AR</title>

  <!-- A-Frame + MindAR (Image Tracking). Muss später von deinem Server geladen werden. -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
    }

    /* iOS Safari: tatsächliche sichtbare Höhe statt 100vh */
    a-scene {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100dvh;
    }

    /* Fallback für ältere Safari-Versionen ohne dvh */
    @supports not (height: 100dvh) {
      a-scene {
        height: 100vh;
      }
    }

    #hinweis-panel {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%);
      max-width: 90%;
      background: rgba(20, 20, 30, 0.92);
      color: #fff;
      padding: 16px 20px;
      border-radius: 12px;
      font-family: system-ui, sans-serif;
      font-size: 18px;
      text-align: center;
      display: none;
      z-index: 999;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    #ladehinweis {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111;
      color: #fff;
      font-family: system-ui, sans-serif;
      font-size: 20px;
      z-index: 1000;
    }
  </style>
</head>
<body>

  <div id="ladehinweis">Kamera wird gestartet … bitte Zugriff erlauben</div>
  <div id="hinweis-panel"></div>

  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind; maxTrack: 3; uiLoading: no; uiScanning: yes;"
    embedded
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <!-- Kamera -->
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- ============ STATION 1: z. B. das Gemälde ============ -->
    <a-entity mindar-image-target="targetIndex: 0">
      <!-- Schwebender Hinweistext über dem Objekt -->
      <a-text
        value="Hinweis: Die Uhr zeigt mehr,\nals das Auge sieht ..."
        align="center"
        color="#FFD700"
        width="4"
        position="0 0.6 0"></a-text>
      <a-plane
        position="0 0 0"
        height="1"
        width="1.6"
        material="color: #111; opacity: 0.7; transparent: true"></a-plane>
    </a-entity>

    <!-- ============ STATION 2: z. B. die Truhe ============ -->
    <a-entity mindar-image-target="targetIndex: 1">
      <a-text
        value="Zahlencode: 4 - 7 - 1"
        align="center"
        color="#00FF88"
        width="4"
        position="0 0.5 0"></a-text>
      <!-- Optional: 3D-Modell statt Text (GLB-Datei auf den Server legen) -->
      <!-- <a-gltf-model src="#schluessel" scale="0.5 0.5 0.5" position="0 0 0.3"></a-gltf-model> -->
    </a-entity>

    <!-- ============ STATION 3: z. B. das Buchregal ============ -->
    <a-entity mindar-image-target="targetIndex: 2">
      <a-text
        value="Suche das rote Buch,\nSeite 42 verrät den Weg."
        align="center"
        color="#FF6688"
        width="4"
        position="0 0.5 0"></a-text>
    </a-entity>

  </a-scene>

  <script>
    const scene = document.querySelector('a-scene');
    const panel = document.getElementById('hinweis-panel');
    const ladehinweis = document.getElementById('ladehinweis');

    scene.addEventListener('loaded', () => {
      ladehinweis.style.display = 'none';
    });

    // Wenn ein Marker erkannt wird: Hinweis auch als Overlay zeigen
    document.querySelectorAll('[mindar-image-target]').forEach((el, i) => {
      const texte = [
        'Hinweis: Die Uhr zeigt mehr, als das Auge sieht ...',
        'Zahlencode: 4 - 7 - 1',
        'Suche das rote Buch, Seite 42 verrät den Weg.'
      ];
      el.addEventListener('targetFound', () => {
        panel.textContent = texte[i] || 'Hinweis gefunden!';
        panel.style.display = 'block';
      });
      el.addEventListener('targetLost', () => {
        panel.style.display = 'none';
      });
    });
  </script>

</body>
</html>
